name: MCP Server Tests

on:
  push:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-tests.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-tests.yml'

jobs:
  test:
    # Windows is in the matrix because the failures it catches are invisible on Linux and
    # expensive in practice: native modules (better-sqlite3 / sqlite-vec) resolve per platform,
    # and POSIX-only test scaffolding (shebang scripts on PATH) silently runs the real binary
    # instead of the stub. Both classes had landed and gone unnoticed here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm install

      # Proves the native read path actually loads on this OS/Node pair. Without it a broken
      # index degrades to a substring scan that still answers every query, so the tests pass
      # and the regression ships.
      - name: Check native read path
        run: npm run doctor

      - name: Run tests
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Restore embedding model cache
        uses: actions/cache@v4
        with:
          path: mcp-server/.models
          key: embeddings-bge-small-en-v1.5-cache

      - name: Run integration tests
        run: npm run test:integration
